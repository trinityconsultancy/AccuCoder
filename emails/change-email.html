<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Change of Email</title>
  <style>body{background:#f7f8fa;font-family:'Segoe UI',Arial,sans-serif;color:#222;margin:0;padding:0}.container{max-width:480px;margin:40px auto;background:#fff;border-radius:12px;box-shadow:0 4px 24px 0 rgba(0,0,0,0.07);padding:32px 28px 28px 28px;border:1px solid #e5e7eb}.logo{display:block;margin:0 auto 24px auto;height:48px}h2{color:#1e293b;font-size:1.5rem;margin-bottom:12px;font-weight:700;letter-spacing:-1px}p{color:#475569;font-size:1rem;margin:12px 0}a.button{display:inline-block;margin-top:18px;padding:12px 28px;background:linear-gradient(90deg,#6366f1 0%,#06b6d4 100%);color:#fff!important;border-radius:8px;font-weight:600;text-decoration:none;font-size:1rem;box-shadow:0 2px 8px 0 rgba(99,102,241,0.08);transition:background 0.2s}a.button:hover{background:linear-gradient(90deg,#06b6d4 0%,#6366f1 100%)}.footer{margin-top:32px;text-align:center;color:#94a3b8;font-size:0.95rem}</style>
</head>
<body>
  <div class="container">
    <img src="https://accucoder.trinityconsultancy.in/images/design-mode/AccuCoder.png" alt="AccuCoder Logo" class="logo" />
    <h2>Confirm Change of Email</h2>
    <p>Follow this link to confirm the update of your email from <b>{{ .Email }}</b> to <b>{{ .NewEmail }}</b>:</p>
    <p><a href="{{ .ConfirmationURL }}" class="button">Change Email</a></p>
    <div class="footer">&copy; {{year}} AccuCoder. All rights reserved.</div>
  </div>
</body>
</html>
