<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm reauthentication</title>
  <style>body{background:#f7f8fa;font-family:'Segoe UI',Arial,sans-serif;color:#222;margin:0;padding:0}.container{max-width:480px;margin:40px auto;background:#fff;border-radius:12px;box-shadow:0 4px 24px 0 rgba(0,0,0,0.07);padding:32px 28px 28px 28px;border:1px solid #e5e7eb}.logo{display:block;margin:0 auto 24px auto;height:48px}h2{color:#1e293b;font-size:1.5rem;margin-bottom:12px;font-weight:700;letter-spacing:-1px}p{color:#475569;font-size:1rem;margin:12px 0}.token-box{background:#f1f5f9;color:#0f172a;font-size:1.25rem;font-weight:600;padding:16px 0;border-radius:8px;letter-spacing:2px;text-align:center;margin:18px 0 8px 0}.footer{margin-top:32px;text-align:center;color:#94a3b8;font-size:0.95rem}</style>
</head>
<body>
  <div class="container">
    <img src="https://accucoder.trinityconsultancy.in/images/design-mode/AccuCoder.png" alt="AccuCoder Logo" class="logo" />
    <h2>Confirm reauthentication</h2>
    <p>Enter the code below to continue:</p>
    <div class="token-box">{{ .Token }}</div>
    <div class="footer">&copy; {{year}} AccuCoder. All rights reserved.</div>
  </div>
</body>
</html>
